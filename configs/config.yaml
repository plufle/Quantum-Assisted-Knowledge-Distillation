defaults:
  - dataset: trashnet
  - teacher: resnet50_in1k
  - student: mobilenetv2_035
  - method: scratch
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

seed: 0
# Per-term gradient norms (alpha*CE, beta*tau^2*KL, gamma*L_kernel) on the first training
# batch of every epoch, kernel methods only. Diagnostic; does not change training.
log_grad_norms: false
device: cuda
run_id: ${dataset.name}__${student.name}__${method.name}__s${seed}
output_dir: results/${run_id}

hydra:
  job:
    chdir: false # keep cwd at repo root — all paths here are relative to it
  output_subdir: null
  run:
    dir: .
