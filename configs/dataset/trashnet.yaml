name: trashnet
data_dir: data/raw/TrashNet
num_classes: 6
class_names: [cardboard, glass, metal, paper, plastic, trash]
image_size: 128
batch_size: 128 # Trap #2 — relational loss is noise below 64; accumulate if memory forces smaller
metric: macro_f1 # primary metric — report accuracy as secondary
small_batch_regime: false # ~14 batches/epoch — plenty for stable BN running stats (Trap #10)
# G1-retune (2026-08-22, scratch/mobilenetv2_035/seed0 screen): the original
# shuffle+class-weighted-CE+strong-RandAugment recipe underfit this tiny (~1750-image),
# from-scratch, no-pretrain student — test macro-F1 0.4892. Switching imbalance handling
# to a weighted sampler (drop the redundant CE class weights), softening RandomResizedCrop
# and RandAugment, and extending the epoch budget took the same seed to 0.6942 test
# macro-F1. Applies to every method (CLAUDE.md rule #3: a pair shares data/optimizer/epochs).
train_sampler: weighted # class-balanced sampling handles imbalance directly
class_weighted_ce: false # redundant with the weighted sampler above; double-counting hurt convergence
ce_label_smoothing: 0.0
random_resized_crop_scale_min: 0.85 # RandomResizedCrop(scale=(this, 1.0)) — Trap #8
randaugment_num_ops: 1
randaugment_magnitude: 5
split:
  ratios: [0.70, 0.15, 0.15]
  seed: 0
  cache_path: data/splits/trashnet.json # never re-split once this exists
