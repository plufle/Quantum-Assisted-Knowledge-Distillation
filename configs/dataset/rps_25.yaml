name: rps_25
data_dir: data/raw/Rock-Paper-Scissors
num_classes: 3
class_names: [paper, rock, scissors]
image_size: 128
batch_size: 128
train_fraction: 0.25 # deliberately low-data — at full size KD gains disappear (CLAUDE.md)
metric: accuracy
# 630 train images / batch 128 = ~5 batches/epoch — too few for a from-scratch student's
# BatchNorm running stats to stabilize (Trap #10). Students disable running-stat tracking
# for this dataset; the pretrained teacher is unaffected (already-good BN stats to fine-tune).
small_batch_regime: true
train_sampler: shuffle
class_weighted_ce: false
# 2026-08-23: kd's 3-seed variance on rps_25 was huge (+/-0.0867) — seed2 crashed to
# 0.6263 test acc (below scratch's own seed2 of 0.7608). ce_label_smoothing=0.1 fixed
# that seed in isolation (0.6263->0.7285), but applied dataset-wide (required by
# CLAUDE.md rule #3) it was a net negative: scratch dropped 0.7267±0.0300->0.6470±0.0663
# (worse AND more variable), rkd dropped 0.7446±0.0478->0.6434±0.0567, and kd's own
# absolute numbers barely moved (0.7186±0.0867->0.7052±0.0831, variance still huge). kd
# only looked like it "passed" against the label-smoothed scratch because scratch got
# weaker, not because kd improved — reverted. See CLAUDE.md's G1-rps gate for the
# (unchanged) original numbers.
ce_label_smoothing: 0.0
random_resized_crop_scale_min: 0.7 # RandomResizedCrop(scale=(this, 1.0)) — Trap #8
randaugment_num_ops: 2
randaugment_magnitude: 9
split:
  seed: 0
  cache_path: data/splits/rps_25.json
